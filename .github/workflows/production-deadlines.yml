name: Production deadline alerts

# Каждые 30 минут с 8:00 до 19:30 по Бишкеку (UTC+6): сайт сам решает,
# что отправить начальнику производства в Telegram.
on:
  schedule:
    - cron: "0,30 2-13 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check deadlines
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://artisan.shop.kg' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS --max-time 90 --retry 2 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron/production-deadlines"
          else
            curl -fsS --max-time 90 --retry 2 \
              "$SITE_URL/api/cron/production-deadlines"
          fi
