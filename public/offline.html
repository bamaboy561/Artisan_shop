<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171613" />
    <title>Нет подключения | Artisan</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Manrope, Arial, sans-serif;
        background: #f4efe7;
        color: #171613;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 460px);
      }

      img {
        display: block;
        width: 72px;
        height: 72px;
        margin-bottom: 28px;
      }

      p {
        margin: 0;
        color: #615a53;
        font-size: 16px;
        line-height: 1.65;
      }

      .eyebrow {
        margin-bottom: 14px;
        color: #c76a43;
        font-family: monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(32px, 10vw, 48px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      button {
        min-height: 48px;
        margin-top: 30px;
        border: 1px solid #171613;
        background: #171613;
        padding: 0 22px;
        color: white;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid #c76a43;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="" width="72" height="72" />
      <p class="eyebrow">Artisan</p>
      <h1>Нет подключения</h1>
      <p>
        Проверьте интернет и повторите попытку. Товары, цены, остатки и заказы
        обновляются только при подключении к сети.
      </p>
      <button type="button" onclick="window.location.reload()">
        Повторить
      </button>
    </main>
  </body>
</html>
