<!doctype html>
<html lang="ru">
<head>
<base href="/raskroy/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artisan Раскрой</title>
<meta name="description" content="Раскрой листов, кромка, ЧПУ и этикетки для мебельного производства">
<meta name="theme-color" content="#0f6b70">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/qrcode.min.js" defer></script>
<script type="module" src="src/app.js"></script>
</head>
<body>
<div class="wrap">
<header class="top panel">
  <div class="brand">Artisan<br>Раскрой</div>
  <div class="hf">
    <label>Наименование<input class="inp t" id="hName" data-h="name"></label>
    <label>Заказчик<input class="inp t" id="hOrder" data-h="order"></label>
    <label>Дата заказа<input class="inp t" id="hDate" type="date" data-h="date"></label>
    <label>Дата готовности<input class="inp t" id="hDue" type="date" data-h="due"></label>
    <label>Статус<select class="inp t" id="hStatus" data-h="status"></select></label>
    <label>Папка<select class="inp t" id="hFolder" data-h="folder"></select></label>
    <label class="grow">Примечание<input class="inp t" id="hNote" data-h="note"></label>
    <span id="siteStatus" class="sitestatus" hidden></span>
  </div>
</header>

<div class="grid">
  <aside class="side">
    <nav class="menu panel" aria-label="Меню">
      <div class="mh">Проект</div>
      <button class="mi" data-screen="projects">Все проекты</button>
      <label class="mi" for="file">Открыть файл…</label>
      <input id="file" type="file" accept=".project,.xml,.xlsx,.csv" hidden>
      <button class="mi" data-act="new">Новый проект</button>
      <div class="mi-row"><button class="mi" data-act="undo" title="Ctrl+Z">Отменить</button><button class="mi" data-act="redo" title="Ctrl+Y">Вернуть</button></div>
      <button class="mi" data-act="paste">Импорт из Excel</button>
      <button class="mi" data-screen="export">Экспорт</button>
      <div class="mh">Цех</div>
      <button class="mi" data-screen="project">Операции проекта</button>
      <button class="mi" data-screen="stock">Склад остатков</button>
      <button class="mi" data-screen="catalog">Каталог материалов</button>
      <button class="mi" data-screen="labels">Этикетки</button>
      <button class="mi" data-screen="report">Печать отчёта</button>
      <button class="mi" data-screen="settings">Настройки</button>
    </nav>
    <div class="panel totals" id="totals"></div>
    <div class="drop" id="drop">Перетащите сюда файл .project из GibLab или Базиса, либо таблицу Excel (.xlsx, .csv)</div>
  </aside>
  <main id="main" style="min-width:0"><div class="panel empty">Загрузка…</div></main>
</div>
</div>
</body>
</html>
